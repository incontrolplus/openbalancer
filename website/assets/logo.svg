<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="lensGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.30" />
    </linearGradient>
    <linearGradient id="lensGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.70" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.40" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Dark Background Container -->
  <rect width="64" height="64" rx="16" fill="#080c14" />
  
  <!-- Outer Concentric Aperture Lens -->
  <circle cx="32" cy="32" r="26" fill="url(#lensGrad1)" />
  
  <!-- Inner Concentric Balancing Lens -->
  <circle cx="32" cy="32" r="18" fill="url(#lensGrad2)" />
  
  <!-- Center Core Hub Node -->
  <circle cx="32" cy="32" r="8" fill="url(#coreGrad)" />
  <circle cx="32" cy="32" r="3.5" fill="#ffffff" />
</svg>
