<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" fill="none" style="height: 36px; width: auto;" aria-label="OpenBalancer">
  <defs>
    <linearGradient id="cbGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.50" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.25" />
    </linearGradient>
    <linearGradient id="cbGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.35" />
    </linearGradient>
    <style>
      .ob-text { font-family: 'Space Grotesk', 'Inter', system-ui, -apple-system, sans-serif; font-size: 42px; font-weight: 700; fill: #ffffff; letter-spacing: -1px; }
      .ob-accent { font-weight: 800; fill: #f8fafc; }
    </style>
  </defs>
  <g>
    <!-- Concentric Aperture Lenses behind the 'O' -->
    <circle cx="48" cy="40" r="36" fill="url(#cbGrad1)" />
    <circle cx="48" cy="40" r="24" fill="url(#cbGrad2)" />
    <!-- Brand Typography -->
    <text class="ob-text" x="20" y="53">Open<tspan class="ob-accent">Balancer</tspan></text>
  </g>
</svg>
